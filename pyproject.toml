[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo_rl"
version = "0.1.0"
authors = [
    { name = "Coolercool47" },
]
description = "Hyperparameter Optimization using Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "tianshou>=2.0.0",
    "gymnasium>=1.0.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "wandb>=0.16.0",
    "tensorboard>=2.13.0",
    "yahpo-gym>=1.0.1",
]

[project.optional-dependencies]
experiments = [
    "torchvision>=0.15.0",
    "optuna>=3.0.0",
    "gpytorch>=1.15.1",
    "botorch>=0.17.0",
]
# experiments_new/ (rebuttal experiments): see experiments_new/requirements.txt and setup_env.*
# yahpo-gym must be installed separately with --no-deps (its pins are outdated).
rebuttal = [
    "optuna>=4.0",
    "cmaes>=0.11",
    "ConfigSpace>=1.2,<2",
    "onnxruntime>=1.17",
    "scikit-learn>=1.4",
    "scikit-posthocs>=0.9",
    "joblib>=1.3",
]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools]
packages = { find = {} }
