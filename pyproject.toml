[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo_rl"
version = "0.1.0"
authors = [
    { name = "Coolercool47" },
]
description = "Hyperparameter Optimization using Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools]
packages = { find = {} }