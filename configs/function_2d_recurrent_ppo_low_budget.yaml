experiment_name: "2d_function_optimization_recurrent_ppo_low_budget"

backend:
  name: "OptimizationBenchmarkBackend"
  params:
    function_name: "rastrigin"
    dimensions: 2
    noise_std: 0
    maximize: False

environment:
  name: "CyclicPipelineEnv"
  params:
    num_bins: 300
    max_steps: 100 
    reward_mode: "per_step"
    step_sizes: [25, 5, 1]
    use_history: false  # LSTM: минимальный obs + prev_reward для RL² адаптации
  hp_space:
    x0:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]
    x1:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]

agent:
  name: "RecurrentPPO"
  policy: "MultiInputLstmPolicy"
  params:
    verbose: 1
    # seed: 42
    gamma: 0.95
    learning_rate: 0.00005 

training:
  total_timesteps: 10000  # 100 эпизодов (100 шагов * 100 эпизодов)

save_path: "model_2d_recurrent_ppo_low_budget"

