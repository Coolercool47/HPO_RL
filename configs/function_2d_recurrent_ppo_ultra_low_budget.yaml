experiment_name: "2d_function_optimization_recurrent_ppo_ultra_low_budget"

backend:
  name: "OptimizationBenchmarkBackend"
  params:
    function_name: "rastrigin"  # Можно изменить на sphere, rosenbrock и т.д.
    dimensions: 2
    noise_std: 0
    maximize: False  # False = минимизация

environment:
  name: "CyclicPipelineEnv"
  params:
    num_bins: 300
    max_steps: 20  # Ультрамалый бюджет: 20 шагов в эпизоде
    sparse_reward: false
    reward_mode: "per_step"  # Reward после каждого шага
    step_sizes: [25, 5, 1]  # Ограничено до 1, 5, и 25
    step_size_penalty_coef: 0.0  # Отключён
    adaptive_step_penalty: false
    use_history: false  # LSTM: минимальный obs + prev_reward для RL² адаптации
  hp_space:
    x0:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]
    x1:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]

agent:
  name: "RecurrentPPO"
  policy: "MultiInputLstmPolicy"
  params:
    verbose: 1
    # seed: 42  # Закомментировано для случайного старта обучения
    gamma: 0.95
    learning_rate: 0.0003  # Исправлено: было 0.003 (слишком много), стандарт для PPO: 0.0003

training:
  total_timesteps: 2000  # 100 эпизодов (20 шагов * 100 эпизодов)

save_path: "model_2d_recurrent_ppo_ultra_low_budget"

