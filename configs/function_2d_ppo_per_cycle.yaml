experiment_name: "2d_function_optimization_ppo_per_cycle"

backend:
  name: "OptimizationBenchmarkBackend"
  params:
    function_name: "rastrigin"  # Можно изменить на sphere, rosenbrock и т.д.
    dimensions: 2
    noise_std: 0
    maximize: False  # False = минимизация (reward = -value, больший reward = меньшее значение)

environment:
  name: "CyclicPipelineEnv"
  params:
    num_bins: 300  # Значительно увеличено для более точного поиска
    max_steps: 1000  # Больше шагов для исследования пространства
    sparse_reward: false
    reward_mode: "per_cycle"  # Reward только после полного цикла (выбора всех параметров)
    step_sizes: [25, 5, 1]  # Большой/средний/маленький шаг
    use_history: true  # Feedforward агенту нужна история
    history_cycles: 3  # Сколько циклов хранить (× num_params = длина окна)
  hp_space:
    x0:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]
    x1:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]

agent:
  name: "PPO"
  policy: "MultiInputPolicy"
  params:
    verbose: 1
    # seed: 42
    gamma: 0.95
    learning_rate: 0.003
    device: "cpu"

training:
  total_timesteps: 200000  # Увеличено для лучшего обучения

save_path: "model_2d_ppo_per_cycle"

