experiment_name: "2d_function_optimization_sac"

backend:
  name: "OptimizationBenchmarkBackend"
  params:
    function_name: "rastrigin"  # Можно изменить на sphere, rosenbrock и т.д.
    dimensions: 2
    noise_std: 0
    maximize: False  # False = минимизация (reward = -value, больший reward = меньшее значение)

environment:
  name: "CyclicPipelineEnv"
  params:
    num_bins: 300  # Значительно увеличено для более точного поиска
    max_steps: 1000  # Больше шагов для исследования пространства
    sparse_reward: false
    action_type: "continuous"  # Непрерывные действия для SAC
    max_step_bins: 30  # Максимальный шаг в бинах (10% от num_bins)
  hp_space:
    x0:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]
    x1:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]

agent:
  name: "SAC"
  policy: "MultiInputPolicy"
  params:
    verbose: 1
    # seed: 42
    gamma: 0.95
    learning_rate: 0.003
    buffer_size: 100000
    batch_size: 512  # Увеличено для лучшего использования GPU
    tau: 0.005  # Коэффициент мягкого обновления target network
    train_freq: 4  # Обучаться каждые 4 шага (меньше частых обновлений)
    gradient_steps: 4  # Больше шагов градиента за раз для эффективности
    # device: "cuda"  # Раскомментируйте для принудительного использования GPU, или "cpu" для CPU
    n_envs: 4  # Количество параллельных сред (раскомментируйте для параллелизма)

training:
  total_timesteps: 200000  # Увеличено для лучшего обучения

save_path: "model_2d_sac"

