experiment_name: "2d_function_optimization_ultra_low_budget"

backend:
  name: "OptimizationBenchmarkBackend"
  params:
    function_name: "rastrigin"  # Можно изменить на sphere, rosenbrock и т.д.
    dimensions: 2
    noise_std: 0
    maximize: False  # False = минимизация (reward = -value, больший reward = меньшее значение)

environment:
  name: "CyclicPipelineEnv"
  params:
    num_bins: 300  # Значительно увеличено для более точного поиска и лучшего transfer learning
    max_steps: 20  # Ультрамалый бюджет: 20 шагов в эпизоде
    sparse_reward: false
    reward_mode: "per_step"  # Reward после каждого шага
    step_sizes: [25, 5, 1]  # Большой/средний/маленький шаг
    step_size_penalty_coef: 0.15  # Штраф за размер шага
    adaptive_step_penalty: true  # Штраф увеличивается с прогрессом эпизода
  hp_space:
    x0:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]
    x1:
      continuous:
        type: float
        log: False
        range: [-5.12, 5.12]

agent:
  name: "PPO"
  policy: "MultiInputPolicy"
  params:
    verbose: 1
    # seed: 42
    gamma: 0.95
    learning_rate: 0.003

training:
  total_timesteps: 2000  # 100 эпизодов (20 шагов * 100 эпизодов)

save_path: "model_2d_ultra_low_budget"

